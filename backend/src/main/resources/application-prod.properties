# ===== Profil "prod" (Render, gratuit) — activé par SPRING_PROFILES_ACTIVE=prod =====
server.port=${PORT:8081}

# Base H2 en mémoire (gratuite) : les comptes sont perdus à chaque redémarrage, suffisant pour un test
spring.datasource.url=jdbc:h2:mem:cryptotrade;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Coach IA (clé fournie par la variable d'environnement Render GROQ_API_KEY)
coach.groq.api-key=${GROQ_API_KEY:}
coach.groq.model=openai/gpt-oss-120b
coach.limite-par-heure=40
coach.limite-par-jour=900
