<div class="crypto-card p-0 overflow-hidden">
  <!-- En-tête -->
  <div class="flex flex-col md:flex-row md:items-center justify-between px-4 py-3 border-b border-crypto-border gap-3">
    <div class="flex items-center gap-2">
      <span class="crypto-live-dot"></span>
      <span class="text-crypto-text font-semibold">{{ symbol }}</span>
      <span class="text-crypto-text-muted text-xs uppercase">{{ interval }}</span>
    </div>
    
    <!-- LÉGENDE DU GRAPHIQUE -->
    <div class="flex flex-wrap items-center gap-4 text-xs">
      <div class="flex items-center gap-1.5">
        <span class="w-2.5 h-2.5 rounded-sm bg-crypto-green"></span>
        <span class="text-crypto-text-muted">Hausse</span>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="w-2.5 h-2.5 rounded-sm bg-crypto-red"></span>
        <span class="text-crypto-text-muted">Baisse</span>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="w-4 h-[2px] bg-crypto-yellow"></span>
        <span class="text-crypto-text-muted">MA 20</span>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="w-3 h-2 bg-crypto-card-hover"></span>
        <span class="text-crypto-text-muted">Volume</span>
      </div>
    </div>
  </div>

  <!-- Graphique principal -->
  <div #chartContainer style="width: 100%; height: 400px;"></div>

  <!-- Graphique RSI -->
  <div class="border-t border-crypto-border flex items-center justify-between px-4 py-2 bg-crypto-bg">
    <span class="text-crypto-text-muted text-xs font-medium cursor-help" title="Le RSI mesure la vitesse et l'ampleur des mouvements. >70 = Surachat, <30 = Survente.">
      RSI (14)
    </span>
    <span class="text-crypto-text-muted text-xs">
      <span class="text-crypto-purple font-bold">━</span> RSI 14
      <span class="ml-3 text-crypto-red">─ 70 (Surachat)</span>
      <span class="ml-3 text-crypto-green">─ 30 (Survente)</span>
    </span>
  </div>
  <div #rsiContainer style="width: 100%; height: 120px;"></div>
</div>
