<ol class="space-y-0" aria-label="Parcours des leçons">
  @for (lesson of lessons; track lesson.id; let last = $last) {
    @let status = statusFor(lesson);
    <li class="relative flex gap-3 pb-6" [class.pb-0]="last">
      @if (!last) {
        <span
          class="absolute start-[15px] top-8 h-[calc(100%-1rem)] w-px"
          [class]="status === 'COMPLETED' ? 'bg-crypto-green/40' : 'bg-crypto-border'"
          aria-hidden="true"
        ></span>
      }

      <div class="relative z-1 flex h-8 w-8 shrink-0 items-center justify-center rounded-full border text-xs font-semibold"
        [class]="
          status === 'COMPLETED'
            ? 'border-crypto-green bg-crypto-green/15 text-crypto-green'
            : status === 'CURRENT'
              ? 'border-crypto-green bg-crypto-green text-crypto-bg ring-4 ring-crypto-green/20'
              : 'border-crypto-border bg-crypto-bg text-crypto-text-muted'
        ">
        @if (status === 'COMPLETED') {
          ✓
        } @else if (status === 'LOCKED') {
          🔒
        } @else {
          ▶
        }
      </div>

      <button
        type="button"
        class="min-w-0 flex-1 rounded-lg border px-3 py-2.5 text-start transition focus:outline-none focus-visible:ring-2 focus-visible:ring-crypto-green/50"
        [disabled]="status === 'LOCKED'"
        [class]="
          lesson.id === activeLessonId
            ? 'border-crypto-green/50 bg-crypto-green/10'
            : status === 'LOCKED'
              ? 'cursor-not-allowed border-crypto-border/60 opacity-60'
              : 'border-crypto-border bg-crypto-card hover:border-crypto-green/30 hover:bg-crypto-card-hover'
        "
        (click)="onSelect(lesson, status)"
      >
        <span class="text-xs text-crypto-text-muted">{{ lesson.order.toString().padStart(2, '0') }}</span>
        <span class="mt-0.5 block text-sm font-medium text-crypto-text">{{ lesson.title }}</span>
        <span class="mt-1 text-xs" [class]="status === 'CURRENT' ? 'text-crypto-green' : 'text-crypto-text-muted'">
          {{ statusLabel(status) }}
        </span>
      </button>
    </li>
  }
</ol>
