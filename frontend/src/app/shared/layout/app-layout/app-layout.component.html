<div class="min-h-screen xl:flex">
  <div>
    <app-sidebar></app-sidebar>
    <app-backdrop></app-backdrop>
  </div>
  <div
      class="flex-1 transition-all duration-300 ease-in-out overflow-hidden"
      [ngClass]="{
        'xl:ms-[290px]': (isExpanded$ | async) || (isHovered$ | async),
        'xl:ms-[90px]': !(isExpanded$ | async) && !(isHovered$ | async),
        'ms-0': (isMobileOpen$ | async)
      }"
  >
    <!-- TICKER CRYPTO (bandeau défilant en haut) -->
    <app-crypto-ticker></app-crypto-ticker>

    <!-- app header start -->
    <app-header/>
    <!-- app header end -->

    <!-- Contenu principal -->
    <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>

<!-- Notifications d'ordres (ordre exécuté, rejeté...) -->
<app-order-toasts></app-order-toasts>
