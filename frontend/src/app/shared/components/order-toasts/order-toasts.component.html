<div class="pointer-events-none fixed end-4 top-20 z-[100000] flex w-[22rem] max-w-[calc(100vw-2rem)] flex-col gap-3" aria-live="polite">
  @for (n of service.notifications(); track n.id) {
    <div
      role="status"
      class="pointer-events-auto flex items-start gap-3 rounded-xl border p-4 shadow-theme-lg"
      [class]="n.type === 'succes'
        ? 'border-success-200 bg-success-50 text-success-700 dark:border-success-500/30 dark:bg-gray-900 dark:text-success-500'
        : 'border-error-200 bg-error-50 text-error-700 dark:border-error-500/30 dark:bg-gray-900 dark:text-error-400'"
    >
      <span class="mt-0.5 text-lg leading-none">{{ n.type === 'succes' ? '✔' : '✖' }}</span>
      <div class="min-w-0 flex-1">
        <p class="text-sm font-semibold">{{ n.titre }}</p>
        <p class="mt-1 text-theme-xs opacity-90">{{ n.texte }}</p>
      </div>
      <button
        type="button"
        (click)="service.fermer(n.id)"
        class="text-lg leading-none opacity-60 hover:opacity-100"
        aria-label="Fermer la notification"
      >
        ×
      </button>
    </div>
  }
</div>
