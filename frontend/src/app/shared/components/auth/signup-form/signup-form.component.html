<div class="w-full max-w-md pt-10 mx-auto">
  <a routerLink="/" class="inline-flex items-center text-sm text-gray-500 transition-colors hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300">
    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 20 20" fill="none" class="size-5 stroke-current"><path d="M12.7083 5L7.5 10.2083L12.7083 15.4167" stroke="" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    Retour au tableau de bord
  </a>
</div>

<div class="flex flex-col justify-center flex-1 w-full max-w-md mx-auto">
  <div class="mb-5 sm:mb-8">
    <h1 class="mb-2 font-semibold text-gray-800 text-title-sm dark:text-white/90 sm:text-title-md">Inscription</h1>
    <p class="text-sm text-gray-500 dark:text-gray-400">Créez votre compte joueur.</p>
  </div>

  <form (ngSubmit)="onSignUp()" class="space-y-6">
    <div>
      <label for="nom" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Nom <span class="text-error-500">*</span></label>
      <input id="nom" name="nom" type="text" [(ngModel)]="nom" required maxlength="60" autocomplete="name" placeholder="Votre nom"
        class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 text-sm text-gray-800 placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90" />
    </div>

    <div>
      <label for="email" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Email <span class="text-error-500">*</span></label>
      <input id="email" name="email" type="email" [(ngModel)]="email" required autocomplete="email" placeholder="vous@exemple.com"
        class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 text-sm text-gray-800 placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90" />
    </div>

    <div>
      <label for="password" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Mot de passe <span class="text-error-500">*</span></label>
      <div class="relative">
        <input id="password" name="password" [type]="showPassword() ? 'text' : 'password'" [(ngModel)]="password" required
          autocomplete="new-password" placeholder="8 caractères minimum"
          class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 pr-20 text-sm text-gray-800 placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90" />
        <button type="button" (click)="togglePasswordVisibility()"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-medium text-gray-500 hover:text-gray-700 dark:text-gray-400">
          {{ showPassword() ? 'Masquer' : 'Afficher' }}
        </button>
      </div>
    </div>

    @if (erreur()) {
      <p class="rounded-lg border border-error-200 bg-error-50 px-4 py-2.5 text-sm text-error-700 dark:border-error-500/30 dark:bg-error-500/15 dark:text-error-400">{{ erreur() }}</p>
    }

    <button type="submit" [disabled]="enCours() || !nom || !email || !password"
      class="flex h-11 w-full items-center justify-center rounded-lg bg-brand-500 text-sm font-medium text-white transition hover:bg-brand-600 disabled:opacity-60">
      {{ enCours() ? 'Création…' : 'Créer mon compte' }}
    </button>
  </form>

  <p class="mt-5 text-center text-sm text-gray-700 dark:text-gray-400 sm:text-start">
    Déjà un compte ?
    <a routerLink="/signin" class="text-brand-500 hover:text-brand-600 dark:text-brand-400">Se connecter</a>
  </p>
</div>
