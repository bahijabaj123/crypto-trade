spring.application.name=backend
server.port=8081

# Base de donnees H2 dans un FICHIER (./data/cryptotrade.mv.db) : les ordres et le portefeuille
# survivent aux redemarrages. Pour repartir de zero : arreter le backend et supprimer le dossier "data".
# (Version en memoire, qui se vide a chaque redemarrage : jdbc:h2:mem:cryptotrade;DB_CLOSE_DELAY=-1)
spring.datasource.url=jdbc:h2:file:./data/cryptotrade;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Les nombres decimaux sont envoyes sans notation scientifique (2.5E+4)
spring.jackson.generator.write-bigdecimal-as-plain=true

# Binance : mettre enabled=false pour travailler hors ligne avec des prix fixes
app.binance.enabled=true
app.binance.base-url=https://api.binance.com
app.binance.cache-ms=2000

# Capital virtuel de depart (en USDT)
app.portefeuille.solde-initial=100000

# Taches de fond : surveillance des ordres en attente et courbe de valeur
app.moteur.actif=true
app.moteur.intervalle-ordres-ms=5000
app.moteur.intervalle-snapshot-ms=30000

# Gestion du risque : part maximale d'UN actif dans le portefeuille (refus au-dela) et seuil d'alerte
app.risque.exposition-max-pct=40
app.risque.exposition-alerte-pct=25
