<div class="crypto-card">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-lg font-semibold text-crypto-text">Comparateur multi-actifs</h2>
    <div class="flex gap-2">
      <button
        *ngFor="let i of ['1h', '4h', '1d', '1w']"
        (click)="changeInterval(i)"
        [ngClass]="interval === i ? 'bg-crypto-green/10 text-crypto-green' : 'bg-crypto-card-hover text-crypto-text-muted hover:text-crypto-text'"
        class="px-3 py-1.5 text-xs rounded-md transition"
      >
        {{ i.toUpperCase() }}
      </button>
    </div>
  </div>

  <!-- Sélecteur d'actifs -->
  <div class="flex flex-wrap gap-2 mb-4">
    <button
      *ngFor="let symbol of availableSymbols"
      (click)="toggleSymbol(symbol)"
      [ngClass]="isSelected(symbol) ? 'bg-crypto-green/10 text-crypto-green border-crypto-green' : 'bg-crypto-card-hover text-crypto-text-muted border-crypto-border hover:text-crypto-text'"
      class="px-3 py-1.5 text-xs rounded-md border transition"
    >
      {{ symbol.replace('USDT', '') }}
    </button>
  </div>

  <!-- Graphique -->
  <div *ngIf="loading" class="text-center py-12">
    <p class="text-crypto-text-muted">Chargement...</p>
  </div>

  <div *ngIf="!loading && series.length > 0" class="relative">
    <svg viewBox="0 0 800 300" class="w-full" style="height: 300px;">
      <!-- Grille -->
      <g *ngFor="let label of getYAxisLabels()">
        <line x1="0" [attr.y1]="label.y" x2="800" [attr.y2]="label.y" stroke="#2B3139" stroke-width="1"/>
        <text x="5" [attr.y]="label.y - 5" fill="#848E9C" font-size="10">{{ label.value.toFixed(1) }}</text>
      </g>

      <!-- Ligne de base 100 -->
      <line x1="0" y1="150" x2="800" y2="150" stroke="#848E9C" stroke-width="1" stroke-dasharray="4,4"/>

      <!-- Courbes -->
      <path
        *ngFor="let s of series"
        [attr.d]="getPath(s)"
        [attr.stroke]="s.color"
        fill="none"
        stroke-width="2"
      />
    </svg>

    <!-- Légende -->
    <div class="flex flex-wrap gap-4 mt-4">
      <div *ngFor="let s of series" class="flex items-center gap-2">
        <span [style.background-color]="s.color" class="w-3 h-3 rounded-full"></span>
        <span class="text-crypto-text text-sm font-medium">{{ s.symbol }}</span>
      </div>
    </div>
  </div>
</div>
