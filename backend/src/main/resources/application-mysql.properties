# Profil "mysql" : les donnees sont gardees dans MySQL meme apres un redemarrage.
# Activer : IntelliJ > Run > Edit Configurations > BackendApplication > "Active profiles" = mysql
# Avant : demarrer MySQL (XAMPP) puis creer la base :
#   CREATE DATABASE cryptotrade CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;

spring.datasource.url=jdbc:mysql://localhost:3306/cryptotrade?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# XAMPP : mot de passe vide par defaut. Sinon, ecris-le ici.
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cree / met a jour les tables automatiquement
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# La console H2 ne sert plus
spring.h2.console.enabled=false
